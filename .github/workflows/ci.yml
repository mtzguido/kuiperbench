name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  KUIPER_NIGHTLY: 2026-08-25

jobs:
  verify:
    name: Verify, extract, and check dist
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fstarlang/kuiper-base-nocuda:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Clean runner workspace
        run: find . -delete

      - name: Check out KuiperBench
        uses: actions/checkout@v6

      - name: Set up build environment
        run: |
          echo "HOME=/home/vscode" >> "$GITHUB_ENV"
          echo "PATH=/usr/local/bin:$PATH" >> "$GITHUB_ENV"

      - name: Restore Kuiper binary package
        uses: actions/cache@v5
        with:
          path: .kuiper
          key: kuiper-nightly-${{ env.KUIPER_NIGHTLY }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install fixed verification environment
        run: make -j4 prepare

      - name: Verify and extract
        # F* workers can have large SMT heaps. Two concurrent workers fit on
        # the standard hosted runner; using all four cores is OOM-killed.
        run: make -j2 all

      - name: Check generated distribution
        run: |
          make -j4 dist
          git diff --exit-code -- dist
