name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify, extract, and check dist
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fstarlang/kuiper-base-nocuda:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Clean runner workspace
        run: find . -delete

      - name: Check out KuiperBench
        uses: actions/checkout@v6

      - name: Set up build environment
        run: |
          echo "HOME=/home/vscode" >> "$GITHUB_ENV"
          echo "PATH=/usr/local/bin:$PATH" >> "$GITHUB_ENV"

      - name: Read Kuiper nightly pin
        id: kuiper_pin
        run: |
          nightly=$(<kuiper-version.txt)
          [[ "$nightly" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "nightly=$nightly" >> "$GITHUB_OUTPUT"

      - name: Restore Kuiper binary package
        uses: actions/cache@v5
        with:
          path: .kuiper
          key: kuiper-nightly-${{ steps.kuiper_pin.outputs.nightly }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install fixed verification environment
        run: make -skj4 prepare

      - name: Verify
        run: |
          jobs=$(scripts/ci-jobs.sh 3072)
          echo "Verifying with $jobs job(s)."
          make -skj"$jobs" verify

      - name: Extract
        run: |
          # Extraction has a higher per-process memory peak than verification.
          jobs=$(scripts/ci-jobs.sh 8192)
          echo "Extracting with $jobs job(s)."
          make -skj"$jobs" extract-all

      - name: Check generated distribution
        run: |
          make -skj4 dist
          git diff --exit-code -- dist

  build-kernelbench:
    name: Build KernelBench wrappers (${{ matrix.shard }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: pytorch/pytorch:2.9.1-cuda12.6-cudnn9-devel
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      MAX_JOBS: 2
      TORCH_CUDA_ARCH_LIST: "7.0"
      TORCH_EXTENSIONS_DIR: ${{ github.workspace }}/.torch-extensions/${{ matrix.shard }}
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git make
          python -m pip install --quiet 'ninja>=1.13.0'

      - name: Check out KuiperBench
        uses: actions/checkout@v6

      - name: Read Kuiper nightly pin
        id: kuiper_pin
        run: |
          nightly=$(<kuiper-version.txt)
          [[ "$nightly" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "nightly=$nightly" >> "$GITHUB_OUTPUT"

      - name: Restore Kuiper binary package
        uses: actions/cache@v5
        with:
          path: .kuiper
          key: kuiper-nightly-${{ steps.kuiper_pin.outputs.nightly }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install Kuiper package
        run: make -skj4 install-kuiper

      - name: Stage checked-in generated sources
        run: |
          mkdir -p obj
          cp dist/*.cu dist/*.h obj/

      - name: Compile and load every challenge wrapper
        run: >-
          python scripts/check-kernelbench-builds.py
          --shard-index ${{ matrix.shard }}
          --shard-count 4

  # Branch protection points here
  ciok:
    runs-on: ubuntu-latest
    if: ${{ cancelled() || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure') }}
    # Work around https://github.com/actions/runner/issues/2566.
    needs:
      - verify
      - build-kernelbench
    steps:
      # This only runs on failure. Otherwise it is skipped, which counts as a
      # success for branch protection.
      - run: exit 1
